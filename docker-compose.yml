version: '3.8'

services:
    backend:
        container_name: license-plate-recognition-backend
        build:
            context: ./be
            dockerfile: Dockerfile
        ports:
            - '9000:8000'

    frontend:
        container_name: license-plate-recognition-frontend
        build:
            context: ./fe
            dockerfile: Dockerfile
        ports:
            - '4005:3000'
        depends_on:
            - backend
